<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oncolos</title>
  <script>
    // SPA fallback: redirect 404s back to the root, preserving query string and hash
    // so that invite links like /?ref=XXX still work even if the server returns 404
    var search = window.location.search;
    var hash = window.location.hash;
    var path = window.location.pathname;
    // Redirect to root with the original query/hash intact
    window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
